<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taharah Adventure</title>
<style>
:root{--bg:#EAF6FD;--card:#fff;--ink:#16324A;--mut:#5B7487;--brand:#1F8FCB;--brand2:#0E6FA8;--acc:#FFB020;--good:#2E9E5B;--bad:#E0533D;--line:#CFE6F3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E2A;--card:#172B3B;--ink:#EAF3F8;--mut:#9DB6C6;--brand:#3BA9E0;--brand2:#1F8FCB;--line:#27465C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1E2A;--card:#172B3B;--ink:#EAF3F8;--mut:#9DB6C6;--brand:#3BA9E0;--brand2:#1F8FCB;--line:#27465C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
#app{max-width:540px;margin:0 auto;padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
header{text-align:center;padding:8px 0 4px}
.logo{font-size:56px;animation:bob 2s ease-in-out infinite}
h1{margin:4px 0;font-size:28px;color:var(--brand2)}
header p{margin:0 0 8px;color:var(--mut)}
.total{display:inline-block;background:var(--acc);color:#3a2a00;font-weight:bold;border-radius:20px;padding:4px 14px}
.grid{display:grid;gap:10px;margin-top:12px}
.gcard{display:grid;grid-template-columns:56px 1fr auto;gap:2px 12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
.gcard:active{transform:translateY(2px);box-shadow:none}
.gcard .em{grid-row:span 2;font-size:40px;text-align:center}
.gcard b{font-size:18px}.gcard small{color:var(--mut)}
.gcard i{grid-row:span 2;font-style:normal;color:var(--acc);letter-spacing:1px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar b{flex:1;font-size:18px}.bar span{color:var(--mut);font-weight:bold}
.back{background:var(--card);border:2px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:20px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;text-align:center}
.panel h2{margin:6px 0 14px;font-size:21px}
.big{font-size:72px;animation:pop .5s}
.opt,.btn{display:block;width:100%;margin:8px 0;padding:14px;border-radius:14px;border:2px solid var(--brand);background:var(--card);font-size:17px;font-weight:bold;box-shadow:0 3px 0 var(--brand)}
.opt:active:not(:disabled),.btn:active{transform:translateY(2px);box-shadow:none}
.btn{background:var(--brand);color:#fff;border-color:var(--brand2);box-shadow:0 3px 0 var(--brand2)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.opt.good,.pick.good{background:var(--good);border-color:var(--good);color:#fff;box-shadow:none}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:none}
.fb{background:var(--bg);border-radius:12px;padding:10px;margin:10px 0 4px;text-align:left}
.stars{font-size:40px;color:var(--acc);margin:6px 0 12px}
.step{display:flex;align-items:center;gap:10px;width:100%;margin:7px 0;padding:11px 14px;border-radius:14px;border:2px solid var(--brand);background:var(--card);text-align:left;font-size:16px;font-weight:bold}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none}
.step.good{background:var(--good);border-color:var(--good);color:#fff}.step.good .n{background:#fff;color:var(--good)}
.shake{animation:shake .35s}
.sc .card{font-size:84px;margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;border-radius:14px;border:2px solid var(--brand);background:var(--brand);color:#fff;font-size:11.5px;font-weight:bold;padding:4px;display:grid;place-items:center;line-height:1.15}
.mc span{display:none}.mc.up,.mc.done{background:var(--card);color:var(--ink)}.mc.up span,.mc.done span{display:block}.mc.up b,.mc.done b{display:none}.mc b{font-size:26px}
.mc.done{border-color:var(--good);background:#d9f3e3;color:#12532e}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var app=document.getElementById('app');
function $(s){return app.querySelector(s)}
function sh(a){return a.slice().sort(function(){return Math.random()-.5})}
function st(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
var best={};
var G=[
{id:'quiz',em:'🧠',t:'Quick Quiz',d:'Answer questions about taharah',run:quiz},
{id:'wudhu',em:'🚿',t:'Wudu Steps',d:'Put the wudu steps in order',run:wudhu},
{id:'najis',em:'🧼',t:'Pure or Najis?',d:'Is it pure or impure?',run:function(){sorter('najis','Pure or Najis?',NJ,['✨ Pure','⚠️ Najis'])}},
{id:'batal',em:'💨',t:'Broken or Not?',d:'What breaks your wudu?',run:function(){sorter('batal','Broken or Not?',BT,['✅ Not broken','❌ Broken'])}},
{id:'mem',em:'🃏',t:'Matching Cards',d:'Match each word with its meaning',run:memory}
];
function home(){
 var tot=0;G.forEach(function(g){tot+=best[g.id]||0});
 app.innerHTML='<header><div class="logo">💧</div><h1>Taharah Adventure</h1><p>Let’s learn about cleanliness by playing!</p><div class="total">⭐ '+tot+' / '+G.length*3+'</div></header><div class="grid">'+
 G.map(function(g){return '<button class="gcard" data-id="'+g.id+'"><span class="em">'+g.em+'</span><b>'+g.t+'</b><small>'+g.d+'</small><i>'+st(best[g.id]||0)+'</i></button>'}).join('')+'</div>';
 app.querySelectorAll('.gcard').forEach(function(b){b.onclick=function(){G.filter(function(g){return g.id==b.dataset.id})[0].run()}});
}
function topbar(t,p){return '<div class="bar"><button class="back" id="back">←</button><b>'+t+'</b><span>'+p+'</span></div>'}
function bindBack(){$('#back').onclick=home}
function end(id,n,msg){
 best[id]=Math.max(best[id]||0,n);
 app.innerHTML='<div class="panel"><div class="big">'+(n==3?'🏆':n==2?'🎉':'👏')+'</div><h2>'+msg+'</h2><div class="stars">'+st(n)+'</div><button class="btn" id="again">Play again</button><button class="btn ghost" id="menu">Menu</button></div>';
 $('#again').onclick=function(){G.filter(function(g){return g.id==id})[0].run()};
 $('#menu').onclick=home;
}
var QZ=[
{q:'What does taharah mean?',o:['Purifying yourself from hadath and najis','Fasting in Ramadan','Giving charity'],e:'Taharah means purification, so our worship is valid.'},
{q:'Which water can we use for wudu?',o:['Clean water that is pure and purifying','Sweet tea','Fruit syrup'],e:'Rainwater, well water and sea water are purifying.'},
{q:'Wudu begins with…',o:['The intention and saying Bismillah','Washing the feet','Wiping the head'],e:'Every good deed begins with an intention in the heart.'},
{q:'We wash our feet up to…',o:['The ankles','The knees','Just the toes'],e:'Both feet are washed up to the ankles.'},
{q:'If there is no water, we purify with…',o:['Tayammum','Running','Sleeping'],e:'Tayammum replaces wudu or ghusl when there is no water.'},
{q:'What do we use for tayammum?',o:['Clean dust or earth','Soap','Perfume'],e:'We wipe the face and hands with clean dust or earth.'},
{q:'The full bath in Islam is called…',o:['Ghusl','Tayammum','Istinja’'],e:'Ghusl is the full bath that removes major hadath.'},
{q:'Cleaning yourself after using the toilet is called…',o:['Istinja’','Tayammum','Ihram'],e:'Istinja’ removes najis after using the toilet.'},
{q:'In wudu, which part do we wipe instead of wash?',o:['The head','The face','The hands'],e:'We wipe the head, but wash the face, hands and feet.'},
{q:'Which of these is purifying water?',o:['Rainwater','Coffee','Juice'],e:'Rainwater is pure and purifying, so we can use it for wudu.'},
{q:'Why do we make wudu before prayer?',o:['Because prayer needs us to be pure','To cool down','Because a friend said so'],e:'Prayer is not valid unless we are pure first.'},
{q:'When may we do tayammum?',o:['When there is no water or we cannot use water','When there is lots of water','Every day'],e:'Tayammum is only allowed with a reason, like having no water.'}
];
function quiz(){
 var qs=sh(QZ).slice(0,8),i=0,s=0;
 (function show(){
  if(i==qs.length)return end('quiz',s>=7?3:s>=5?2:1,'You scored '+s+' out of 8');
  var q=qs[i],o=sh(q.o.map(function(t,k){return [t,k==0]}));
  app.innerHTML=topbar('Quick Quiz',(i+1)+'/8')+'<div class="panel"><h2>'+q.q+'</h2>'+o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x[0]+'</button>'}).join('')+'<div id="fb"></div></div>';
  bindBack();
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
   var ok=o[b.dataset.k][1];if(ok)s++;
   app.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(o[x.dataset.k][1])x.classList.add('good')});
   if(!ok)b.classList.add('bad');
   $('#fb').innerHTML='<p class="fb">'+(ok?'✅ Correct! ':'❌ Almost! ')+q.e+'</p><button class="btn" id="nx">Next</button>';
   $('#nx').onclick=function(){i++;show()};
  }});
 })();
}
function wudhu(){
 var S=['🙏 Make the intention and say Bismillah','😊 Wash the face','🙌 Wash both arms up to the elbows','💆 Wipe the head','🦶 Wash both feet up to the ankles','🤲 Say the dua after wudu'];
 var ord=sh(S.map(function(x,i){return i})),nx=0,err=0,hint='Tap the FIRST step first!';
 function draw(){
  app.innerHTML=topbar('Wudu Steps',nx+'/6')+'<div class="panel"><h2>'+hint+'</h2>'+ord.map(function(i){var d=i<nx;return '<button class="step'+(d?' good':'')+'" data-i="'+i+'"><span class="n">'+(d?i+1:'?')+'</span>'+S[i]+'</button>'}).join('')+'</div>';
  bindBack();
  app.querySelectorAll('.step').forEach(function(b){b.onclick=function(){
   var i=+b.dataset.i;if(i<nx)return;
   if(i==nx){nx++;hint=nx==6?'MashaAllah, your wudu is perfect! 🎉':'Correct! What comes next?';draw();if(nx==6)setTimeout(function(){end('wudhu',err==0?3:err<=2?2:1,err==0?'No mistakes, amazing!':'Wudu done! '+err+(err==1?' mistake':' mistakes'))},1100)}
   else{err++;hint='Not quite. Try to remember the order 🤔';b.classList.add('shake');$('h2').textContent=hint}
  }});
 }
 draw();
}
var NJ=[
['🌧️','Rainwater',0,'Rainwater is pure and purifying.'],
['🚽','Urine',1,'Urine is najis and must be cleaned.'],
['🌊','Sea water',0,'Sea water is pure and can be used for purification.'],
['🤢','Vomit',1,'Vomit is najis.'],
['🚰','Clean well water',0,'Clean well water is pure.'],
['💩','Faeces (poo)',1,'Human and animal faeces are najis.'],
['🧊','Ice from clean water',0,'Ice made from clean water is still pure.'],
['🩸','Blood',1,'Blood that flows from the body is najis.'],
['🥤','Bottled drinking water',0,'Clean drinking water is pure.'],
['🌿','Clean earth',0,'Clean earth is pure. We even use it for tayammum.']
];
var BT=[
['💨','Passing wind',1,'Passing wind breaks your wudu.'],
['🍎','Eating an apple',0,'Eating and drinking do not break wudu.'],
['🚽','Passing urine',1,'Passing urine breaks your wudu.'],
['🤧','Sneezing',0,'Sneezing does not break wudu.'],
['😴','Deep sleep lying down',1,'Deep sleep breaks your wudu.'],
['🥤','Drinking water',0,'Drinking water does not break wudu.'],
['😵','Fainting',1,'Fainting breaks your wudu.'],
['🗣️','Talking',0,'Talking does not break wudu.'],
['😂','Laughing outside prayer',0,'Laughing outside prayer does not break wudu.'],
['🤲','Scratching your hand',0,'Scratching does not break wudu.']
];
function sorter(id,title,items,lab){
 var it=sh(items),i=0,s=0;
 (function show(){
  if(i==it.length)return end(id,s>=it.length-1?3:s>=it.length*.7?2:1,'You scored '+s+' out of '+it.length);
  var q=it[i];
  app.innerHTML=topbar(title,(i+1)+'/'+it.length)+'<div class="panel sc"><div class="card">'+q[0]+'</div><h2>'+q[1]+'</h2><div class="two"><button class="opt pick" data-a="0">'+lab[0]+'</button><button class="opt pick" data-a="1">'+lab[1]+'</button></div><div id="fb"></div></div>';
  bindBack();
  app.querySelectorAll('.pick').forEach(function(b){b.onclick=function(){
   var ok=+b.dataset.a==q[2];if(ok)s++;
   app.querySelectorAll('.pick').forEach(function(x){x.disabled=true;if(+x.dataset.a==q[2])x.classList.add('good')});
   if(!ok)b.classList.add('bad');
   $('#fb').innerHTML='<p class="fb">'+(ok?'✅ Correct! ':'❌ Almost! ')+q[3]+'</p><button class="btn" id="nx">Next</button>';
   $('#nx').onclick=function(){i++;show()};
  }});
 })();
}
function memory(){
 var P=[['🚿 Wudu','Purifying from minor hadath'],['🛁 Ghusl','The full bath'],['🏜️ Tayammum','Replaces wudu using dust'],['🧼 Najis','Impurity that must be cleaned']];
 var cards=sh(P.reduce(function(a,p,k){return a.concat([{k:k,t:p[0]},{k:k,t:p[1]}])},[]));
 var open=[],moves=0,found=0,lock=false;
 app.innerHTML=topbar('Matching Cards','0 moves')+'<div class="panel"><h2>Match each word with its meaning!</h2><div class="mem">'+cards.map(function(c,i){return '<button class="mc" data-i="'+i+'"><b>❓</b><span>'+c.t+'</span></button>'}).join('')+'</div></div>';
 bindBack();
 var els=app.querySelectorAll('.mc');
 els.forEach(function(b){b.onclick=function(){
  var i=+b.dataset.i;
  if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
  b.classList.add('up');open.push(i);
  if(open.length==2){
   moves++;$('.bar span').textContent=moves+' moves';
   var a=open[0],c=open[1];
   if(cards[a].k==cards[c].k){
    els[a].className='mc done';els[c].className='mc done';open=[];found++;
    if(found==4)setTimeout(function(){end('mem',moves<=6?3:moves<=9?2:1,'Finished in '+moves+' moves!')},900);
   }else{lock=true;setTimeout(function(){els[a].classList.remove('up');els[c].classList.remove('up');open=[];lock=false},900)}
  }
 }});
}
home();
</script>
</body>
</html>
